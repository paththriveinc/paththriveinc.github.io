<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PathThrive</title>
    <script>
      const pathSegmentsToKeep = 0;
      const { pathname, search, hash } = window.location;
      const normalizedPath = pathname
        .split('/')
        .slice(1 + pathSegmentsToKeep)
        .join('/');
      const redirectUrl = `${window.location.origin}/?p=/${normalizedPath}${search.replace(/^\?/, '&')}${hash}`;
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body></body>
</html>
